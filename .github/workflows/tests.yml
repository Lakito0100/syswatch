name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    # ubuntu-latest is Ubuntu 26.04, for which actions/setup-python has no
    # Python 3.9 build (3.9 is end-of-life), so that job failed before running
    # a single test. 3.9 stays in the matrix — Debian 11 and Raspberry Pi OS 11
    # ship it — on the newest runner that still has a build for it.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install psutil ruff
      - name: Lint
        run: ruff check --select E9,F,B --target-version py39 syswatch*.py tests/*.py
      - name: Unit and end-to-end tests
        run: python -m unittest discover -v -s tests -t tests

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-psutil shellcheck
      - name: shellcheck
        run: shellcheck install-syswatch.sh
      - name: Installer tests (need root)
        run: sudo python3 -m unittest discover -v -s tests -t tests -p "test_installer.py"
