name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest supported version (Ubuntu 22.04's python3).
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install psutil ruff
      - name: Lint
        run: ruff check --select E9,F,B --target-version py310 syswatch*.py tests/*.py
      - name: Unit and end-to-end tests
        run: python -m unittest discover -v -s tests -t tests

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-psutil shellcheck
      - name: shellcheck
        run: shellcheck install-syswatch.sh
      - name: Installer tests (need root)
        run: sudo python3 -m unittest discover -v -s tests -t tests -p "test_installer.py"
      - name: sudo file-safety tests (need root)
        run: sudo python3 -m unittest discover -v -s tests -t tests -p "test_files.py"
